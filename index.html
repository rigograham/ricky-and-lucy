<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ricky & Lucy — Backyard Escape</title><style>body{margin:0;background:#101b16;color:white;font:15px system-ui;overflow:hidden}#hud{position:absolute;top:12px;left:12px;right:12px;pointer-events:none;text-shadow:0 2px 5px #000}#mission{font-weight:700;font-size:18px}#hint{margin-top:5px}#controls{position:absolute;bottom:20px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end}button{border:1px solid #ffffff77;background:#1d382cdd;color:white;border-radius:16px;padding:15px;font-weight:bold;touch-action:none}#pad{display:grid;grid-template-columns:repeat(3,48px);gap:4px}#pad button{padding:12px}#actions{display:grid;gap:8px}#actions button{min-width:108px}#message{position:absolute;top:40%;left:10%;right:10%;text-align:center;font-size:24px;font-weight:bold;text-shadow:0 3px 8px #000;pointer-events:none}canvas{display:block}</style><div id="hud"><div id="mission">Find Papa's green cap</div><div id="hint">Move toward the glowing clue, then tap INTERACT.</div><div id="dog">Playing as Lucy</div></div><div id="message"></div><div id="controls"><div id="pad"><span></span><button data-key="up">▲</button><span></span><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><div id="actions"><button id="switch">SWITCH DOG</button><button id="interact">INTERACT</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9dc6df);scene.fog=new THREE.Fog(0x9dc6df,20,50);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x5e754a,2));const sun=new THREE.DirectionalLight(0xffe6b2,2.5);sun.position.set(-6,12,7);sun.castShadow=true;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.88});const grass=mat(0x4e8147),wood=mat(0x987450),choco=mat(0x543322),dark=mat(0x281910);function box(w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}box(24,.2,22,grass,0,-.15,0);for(let x=-12;x<=12;x+=1.1){box(1,.15,2.5,wood,x,1.2,-10.7);box(1,.15,2.5,wood,x,1.2,10.7)}for(let z=-10;z<=10;z+=1.1){box(.2,2.5,1,wood,-12,1.2,z);box(.2,2.5,1,wood,12,1.2,z)}box(8,3.8,5,mat(0xd3c2a2),0,1.8,9);box(9,.35,6,mat(0x575c61),0,3.7,9);box(3,.15,2,mat(0x927357),0,.1,5.6);
function dog(scale){const group=new THREE.Group();const body=new THREE.Mesh(new THREE.SphereGeometry(.65,16,12),choco);body.scale.set(.85,.68,1.4);body.position.y=.8;group.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),choco);head.position.set(0,1.15,-.8);group.add(head);const nose=new THREE.Mesh(new THREE.SphereGeometry(.16,12,8),dark);nose.position.set(0,1.04,-1.2);group.add(nose);for(const s of [-1,1]){let ear=new THREE.Mesh(new THREE.SphereGeometry(.19,10,8),dark);ear.scale.set(.8,1.5,.65);ear.position.set(s*.34,1.04,-.73);group.add(ear);for(const z of [-.65,.65]){let leg=new THREE.Mesh(new THREE.CylinderGeometry(.15,.17,.65,10),choco);leg.position.set(s*.36,.35,z);group.add(leg)}}const tail=new THREE.Mesh(new THREE.CylinderGeometry(.1,.06,.8,8),choco);tail.position.set(0,.94,1.15);tail.rotation.x=.8;group.add(tail);group.scale.setScalar(scale);scene.add(group);return group}const dogs=[dog(.87),dog(1.1)];dogs[0].position.set(-1,0,2);dogs[1].position.set(1,0,2);let active=0,stage=0;const goals=[[-3,0,5.5],[2,0,5.5],[8,0,-8],[0,0,-9.5],[0,0,-11.5]];const names=["Find Papa's green cap","Find Mama's paw-print scarf","Follow the squirrel to the fence","Dig beneath the fence","Escape into the neighborhood!"];function clue(x,z,color){const o=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.08,16),mat(color));o.position.set(x,.1,z);scene.add(o);return o}const clues=[clue(-3,5.5,0x237b34),clue(2,5.5,0xe0c0d6),clue(8,-8,0xa56c32),clue(0,-9.5,0x6a4829),clue(0,-11.5,0xffc05a)];const ring=new THREE.Mesh(new THREE.TorusGeometry(.65,.045,8,32),new THREE.MeshBasicMaterial({color:0xffe86b}));ring.rotation.x=Math.PI/2;scene.add(ring);let keys={};document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});addEventListener('keydown',e=>{if(e.key.startsWith('Arrow'))keys[e.key.slice(5).toLowerCase()]=true;if(e.key===' ')interact();if(e.key.toLowerCase()==='q')switchDog()});addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))keys[e.key.slice(5).toLowerCase()]=false});function switchDog(){active=1-active;document.getElementById('dog').textContent='Playing as '+(active?'Ricky':'Lucy')}document.getElementById('switch').onclick=switchDog;document.getElementById('interact').onclick=interact;function flash(t){const el=document.getElementById('message');el.textContent=t;setTimeout(()=>{if(el.textContent===t)el.textContent=''},1700)}function interact(){let p=dogs[active].position,g=goals[stage];if(Math.hypot(p.x-g[0],p.z-g[2])>2){flash('Move closer to the glowing clue!');return}if(stage===3&&active!==1){flash('Ricky is strong enough to widen the tunnel! Switch dogs.');return}stage++;if(stage===5){document.getElementById('mission').textContent='LEVEL 1 COMPLETE!';document.getElementById('hint').textContent='Ricky and Lucy are free. Their journey begins!';flash('🐾 THE JOURNEY BEGINS 🐾');return}document.getElementById('mission').textContent=names[stage];flash(['Papa’s scent found!','Mama’s scent found!','Lucy found soft dirt!','The tunnel is open!'][stage-1])}let last=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-last)/1000,.04);last=now;let d=dogs[active],dx=(keys.right?1:0)-(keys.left?1:0),dz=(keys.down?1:0)-(keys.up?1:0),len=Math.hypot(dx,dz)||1;d.position.x=Math.max(-11,Math.min(11,d.position.x+dx/len*4*dt));d.position.z=Math.max(-11.7,Math.min(9.5,d.position.z+dz/len*4*dt));if(dx||dz)d.rotation.y=Math.atan2(-dx,-dz);let other=dogs[1-active];other.position.lerp(new THREE.Vector3(d.position.x+(active?-1:1)*1.2,0,d.position.z+1.2),dt*1.4);let g=goals[Math.min(stage,4)];ring.position.set(g[0],.25+Math.sin(now*.003)*.08,g[2]);ring.visible=stage<5;clues.forEach((c,i)=>c.visible=i===stage);let cp=new THREE.Vector3(d.position.x,4.4,d.position.z+7);camera.position.lerp(cp,.07);camera.lookAt(d.position.x,.7,d.position.z-2);renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
