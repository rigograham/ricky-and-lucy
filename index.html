<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ricky & Lucy — Side View V9</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#172e29;font-family:system-ui,-apple-system,sans-serif;color:white;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:start;gap:8px;pointer-events:none}.panel{background:#163b34e8;border:1px solid #ffffff44;border-radius:14px;padding:10px 12px;font-size:13px;max-width:67%;text-shadow:0 1px #0005}.panel strong{display:block;color:#ffdf96;font-size:17px}.version{font-size:11px;letter-spacing:1px;color:#bde9df}.controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;align-items:end;justify-content:space-between;gap:10px}.pad{display:flex;gap:9px}.buttons{display:grid;grid-template-columns:repeat(2,minmax(70px,1fr));gap:8px;max-width:220px}button{border:1px solid #ffffff77;background:#17483de8;color:white;border-radius:17px;font-weight:800;font-size:14px;min-height:64px;padding:10px;touch-action:none;user-select:none}button:active{background:#397c63}.pad button{font-size:26px;width:70px}.restart{position:absolute;top:104px;right:12px;min-height:36px;font-size:12px;padding:8px 10px}.message{position:absolute;top:145px;left:50%;transform:translateX(-50%);text-align:center;max-width:85%;font-size:15px;font-weight:700;text-shadow:0 2px 5px #10291b;background:#20483eaa;border-radius:10px;padding:7px 12px;pointer-events:none}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="panel"><strong>🐾 Ricky & Lucy</strong><span id="objective">Walk right toward the fence</span><div class="version">SIDE VIEW • V9</div></div><div class="panel" id="leader">Leading: Lucy 🎀</div></div><button class="restart" id="restart">↻ Restart</button><div class="message" id="message">Walk right ➜</div><div class="controls"><div class="pad"><button id="left">◀</button><button id="right">▶</button></div><div class="buttons"><button id="switch">Switch</button><button id="sniff">Sniff</button><button id="dig">Dig</button><button id="dash">Dash ⚡</button></div></div><script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W=0,H=0,scale=1,ground=0;
function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.round(W*devicePixelRatio);canvas.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ground=H*.67;}addEventListener('resize',resize);resize();
const state={lucy:110,ricky:45,leader:'Lucy',dir:1,walk:0,phase:0,progress:0,particles:[],time:0,held:0,escape:null,cam:0,digAnim:0};const fence=()=>Math.max(290,W*.77);const goal=()=>fence()-72;
function msg(t){document.querySelector('#message').textContent=t}function objective(t){document.querySelector('#objective').textContent=t}function reset(){Object.assign(state,{lucy:110,ricky:45,leader:'Lucy',dir:1,walk:0,phase:0,progress:0,particles:[],time:0,held:0,escape:null,cam:0,digAnim:0});msg('Walk right ➜');objective('Walk right toward the fence');updateLeader()}function updateLeader(){document.querySelector('#leader').textContent='Leading: '+state.leader+(state.leader==='Lucy'?' 🎀':' 💙')}
function switchDog(){state.leader=state.leader==='Lucy'?'Ricky':'Lucy';updateLeader();msg(state.leader+' is leading')}
function move(dir,dt){if(state.phase>=3||state.escape)return;state.dir=dir;const dog=state.leader.toLowerCase();const speed=state.phase===0?120:0;if(speed){state[dog]=Math.max(35,Math.min(goal(),state[dog]+dir*speed*dt));const other=dog==='lucy'?'ricky':'lucy';if(dir>0&&state[other]<state[dog]-60)state[other]=Math.min(goal()-48,state[other]+speed*dt*.7);state.walk+=dt*12;if(state.lucy>=goal()-4){state.phase=1;msg('Sniff the loose soil!');objective('Sniff the ground, then Dig');}}}
function sniff(){if(state.phase===0){msg('First walk toward the fence ➜');return}if(state.phase===1){state.phase=2;msg('Lucy found a soft patch! Tap Dig');objective('Dig a tunnel under the fence')}else if(state.phase===2)msg('The scent leads under the fence! Dig!')}
function dig(){
 if(state.phase<2){msg('Walk to the fence, then Sniff');return}
 if(state.phase>=3)return;
 if(state.escape){msg('Watch the crawl finish!');return}
 state.progress++;state.digAnim=0.9;
 for(let i=0;i<24;i++)state.particles.push({x:fence()-16,y:ground+2,vx:-35-Math.random()*165,vy:-65-Math.random()*150,life:.6+Math.random()*.5,r:2+Math.random()*5});
 if(state.progress<6){msg('Lucy digs with her front paws! '+state.progress+'/6');objective('Keep digging to open Lucy’s tunnel')}
 if(state.progress===6){state.lucy=fence()-80;state.escape={who:'lucy',t:0,duration:3.5,start:state.lucy,end:fence()+110};msg('Watch Lucy wriggle underneath!');objective('Lucy is crawling beneath the fence')}
 if(state.progress>6&&state.progress<13){msg('Widen the tunnel for Ricky! '+(state.progress-6)+'/7');objective('Ricky needs a bigger opening')}
 if(state.progress===13){state.ricky=fence()-100;state.escape={who:'ricky',t:0,duration:4,start:state.ricky,end:fence()+100};msg('Watch Ricky squeeze through!');objective('Ricky is crawling beneath the fence')}
}
function dash(){if(state.phase===3){state.phase=4;msg('Chapter One complete! 🌲🐾');objective('Ricky and Lucy are free!')}else msg('Escape the fence first!')}
for(const [id,fn] of [['switch',switchDog],['sniff',sniff],['dig',dig],['dash',dash],['restart',reset]])document.getElementById(id).addEventListener('click',fn);
for(const [id,dir] of [['left',-1],['right',1]]){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);state.held=dir});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(state.held===dir)state.held=0})}
addEventListener('keydown',e=>{if(e.key==='ArrowRight')state.held=1;if(e.key==='ArrowLeft')state.held=-1;if(e.key===' ')dig()});addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))state.held=0});
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function background(){let sky=ctx.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#7ec3db');sky.addColorStop(1,'#f4d5a1');rect(0,0,W,H,sky);ellipse(W*.76,H*.2,40,40,'#fff0b2');for(let i=0;i<6;i++){let x=i*160-65;ellipse(x,ground-85,150,65,i%2?'#8bbf94':'#78ac86')}rect(0,ground,W,H-ground,'#6a9f55');rect(0,ground+25,W,H-ground,'#75ab5d');for(let i=0;i<28;i++){let x=(i*79+23)%W,y=ground+25+(i*43)%(Math.max(35,H-ground-125));ellipse(x,y,2,4,i%3?'#f9e3a1':'#f5b7b6')}for(let i=0;i<5;i++){let x=(i*181+45)%W;rect(x,ground-82,9,83,'#70543a');ellipse(x+4,ground-92,34,42,'#47815a');ellipse(x-10,ground-110,26,31,'#5b9765')}}
function drawFence(){
 const x=fence();
 // Fence boards stop above the excavated passage. A ground-level cutaway makes the dogs visible.
 const gap=state.progress?Math.min(36,8+state.progress*2.5):0;
 const base=ground-gap;
 rect(x+8,ground-168,14,168-gap,'#75503a');
 for(let i=0;i<6;i++){
  let px=x+i*29;rect(px,ground-172,26,172-gap,'#c29160');
  ctx.fillStyle='#c29160';ctx.beginPath();ctx.moveTo(px,ground-172);ctx.lineTo(px+13,ground-191);ctx.lineTo(px+26,ground-172);ctx.fill();
  rect(px+21,ground-170,2,170-gap,'#9d704c');
 }
 rect(x,ground-136,175,13,'#8d633f');rect(x,ground-65,175,12,'#8d633f');
 if(state.progress){
  ellipse(x+8,ground+7,Math.min(65,17+state.progress*4),Math.min(24,6+state.progress*1.6),'#765139');
  ellipse(x+8,ground+9,Math.min(58,13+state.progress*3.8),Math.min(18,4+state.progress*1.2),'#30261e');
  ellipse(x-66,ground+7,Math.min(48,state.progress*4),Math.min(13,state.progress*1.2),'#9c6b42');
 }
}
function dog(x,kind){
 const big=kind==='Ricky',s=big?1.04:.83,who=kind.toLowerCase();
 const crawl=state.escape&&state.escape.who===who;
 const digPose=state.digAnim>0&&!state.escape&&state.phase===2&&((state.progress<=6&&kind==='Lucy')||(state.progress>6&&kind==='Ricky'));
 const isMoving=(state.phase===0&&state.held!==0)||state.phase===4;
 const step=isMoving?Math.sin(state.time*13)*8:0;
 const digging=digPose?Math.sin(state.time*25)*13:0;
 let coat=big?'#68412c':'#805038',dark=big?'#4e3022':'#613b2a';
 ctx.save();ctx.translate(x,ground-13);
 if(crawl){ctx.translate(0,11);ctx.scale(1,.60)}
 if(digPose){ctx.translate(8,10);ctx.rotate(-.10)}
 ctx.scale(s,s);
 ellipse(-4,8,55,8,'#3b503b66');
 ctx.strokeStyle=coat;ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-41,-40);ctx.quadraticCurveTo(-63,-53,-55,-70+Math.sin(state.time*8)*7);ctx.stroke();
 // Hind legs, muscular torso, chest, and independently moving front paws.
 for(const [lx,off] of [[-32,-step],[19,step]]){
  ctx.strokeStyle=dark;ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(lx,-35);ctx.lineTo(lx+off*.6,-7);ctx.stroke();ellipse(lx+off*.6+5,-5,10,5,dark)
 }
 ellipse(-6,-48,51,29,coat);ellipse(28,-54,24,25,coat);
 const headY=digPose?-69:-78;
 ellipse(43,headY,21,20,coat);
 ellipse(30,headY+3,9,18,dark);
 ellipse(59,headY+11,14,8,coat);ellipse(70,headY+12,5,4,'#30231e');
 ellipse(53,headY-6,3,3,'#1d1816');
 ctx.strokeStyle=big?'#70b8ef':'#f5a0ba';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(23,-64);ctx.lineTo(42,-61);ctx.stroke();
 if(digPose){
  for(const [px,phase] of [[20,1], [40,-1]]){
   ctx.strokeStyle=coat;ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(px,-42);ctx.lineTo(px+20+digging*phase,-10+Math.abs(digging)*.3);ctx.stroke();
   ellipse(px+23+digging*phase,-8+Math.abs(digging)*.3,11,5,dark)
  }
 }
 ctx.restore();
}
function draw(){
 background();ctx.save();ctx.translate(-state.cam,0);
 drawFence();
 // Dogs are drawn after the fence so their crawl stays visible through the cutaway.
 dog(state.ricky,'Ricky');dog(state.lucy,'Lucy');
 for(let p of state.particles){ellipse(p.x,p.y,p.r,p.r*.75,'#ad784e')}
 ctx.restore();
}
let last=performance.now();function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;state.time+=dt;state.digAnim=Math.max(0,state.digAnim-dt);if(state.held)move(state.held,dt);if(state.escape){const e=state.escape;e.t=Math.min(e.duration,e.t+dt);const k=Math.min(1,e.t/e.duration);const smooth=k*k*(3-2*k);state[e.who]=e.start+(e.end-e.start)*smooth;if(e.t>=e.duration){const who=e.who;state.escape=null;if(who==='lucy'){msg('Lucy is through! Dig a bigger hole for Ricky.');objective('Tap Dig to widen the tunnel for Ricky')}else{state.phase=3;msg('Both dogs are through! Tap Dash ⚡');objective('Both dogs escaped! Run toward the forest')}}}const targetCam=(state.escape||state.phase>=3)?Math.max(0,fence()-W*.40):0;state.cam+=(targetCam-state.cam)*Math.min(1,dt*3);state.particles=state.particles.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;return p.life>0});draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
