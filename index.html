<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ricky & Lucy — Side View V7</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#172e29;font-family:system-ui,-apple-system,sans-serif;color:white;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:start;gap:8px;pointer-events:none}.panel{background:#163b34e8;border:1px solid #ffffff44;border-radius:14px;padding:10px 12px;font-size:13px;max-width:67%;text-shadow:0 1px #0005}.panel strong{display:block;color:#ffdf96;font-size:17px}.version{font-size:11px;letter-spacing:1px;color:#bde9df}.controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;align-items:end;justify-content:space-between;gap:10px}.pad{display:flex;gap:9px}.buttons{display:grid;grid-template-columns:repeat(2,minmax(70px,1fr));gap:8px;max-width:220px}button{border:1px solid #ffffff77;background:#17483de8;color:white;border-radius:17px;font-weight:800;font-size:14px;min-height:64px;padding:10px;touch-action:none;user-select:none}button:active{background:#397c63}.pad button{font-size:26px;width:70px}.restart{position:absolute;top:104px;right:12px;min-height:36px;font-size:12px;padding:8px 10px}.message{position:absolute;top:145px;left:50%;transform:translateX(-50%);text-align:center;max-width:85%;font-size:15px;font-weight:700;text-shadow:0 2px 5px #10291b;background:#20483eaa;border-radius:10px;padding:7px 12px;pointer-events:none}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="panel"><strong>🐾 Ricky & Lucy</strong><span id="objective">Walk right toward the fence</span><div class="version">TRUE SIDE VIEW • V7</div></div><div class="panel" id="leader">Leading: Lucy 🎀</div></div><button class="restart" id="restart">↻ Restart</button><div class="message" id="message">Walk right ➜</div><div class="controls"><div class="pad"><button id="left">◀</button><button id="right">▶</button></div><div class="buttons"><button id="switch">Switch</button><button id="sniff">Sniff</button><button id="dig">Dig</button><button id="dash">Dash ⚡</button></div></div><script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W=0,H=0,scale=1,ground=0;
function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.round(W*devicePixelRatio);canvas.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ground=H*.67;}addEventListener('resize',resize);resize();
const state={lucy:110,ricky:45,leader:'Lucy',dir:1,walk:0,phase:0,progress:0,particles:[],time:0,held:0};const fence=()=>Math.max(290,W*.77);const goal=()=>fence()-72;
function msg(t){document.querySelector('#message').textContent=t}function objective(t){document.querySelector('#objective').textContent=t}function reset(){Object.assign(state,{lucy:110,ricky:45,leader:'Lucy',dir:1,walk:0,phase:0,progress:0,particles:[],time:0,held:0});msg('Walk right ➜');objective('Walk right toward the fence');updateLeader()}function updateLeader(){document.querySelector('#leader').textContent='Leading: '+state.leader+(state.leader==='Lucy'?' 🎀':' 💙')}
function switchDog(){state.leader=state.leader==='Lucy'?'Ricky':'Lucy';updateLeader();msg(state.leader+' is leading')}
function move(dir,dt){if(state.phase>=3)return;state.dir=dir;const dog=state.leader.toLowerCase();const speed=state.phase===0?120:0;if(speed){state[dog]=Math.max(35,Math.min(goal(),state[dog]+dir*speed*dt));const other=dog==='lucy'?'ricky':'lucy';if(dir>0&&state[other]<state[dog]-60)state[other]=Math.min(goal()-48,state[other]+speed*dt*.7);state.walk+=dt*12;if(state.lucy>=goal()-4){state.phase=1;msg('Sniff the loose soil!');objective('Tap Sniff, then Dig');}}}
function sniff(){if(state.phase===0){msg('First walk toward the fence ➜');return}if(state.phase===1){state.phase=2;msg('Lucy found a soft patch! Tap Dig');objective('Dig a tunnel under the fence')}else if(state.phase===2)msg('The scent leads under the fence! Dig!')}
function dig(){if(state.phase<2){msg('Walk to the fence, then Sniff');return}if(state.phase>=3)return;state.progress++;for(let i=0;i<14;i++)state.particles.push({x:fence()-18,y:ground+8,vx:(Math.random()-.5)*170,vy:-Math.random()*160-25,life:.7+Math.random()*.3});if(state.progress===3)msg('Lucy is digging! 🐾');if(state.progress===6){msg('Lucy slips under first!');state.lucy=fence()+75;}if(state.progress===10)msg('Ricky needs a wider tunnel!');if(state.progress>=15){state.ricky=fence()+45;state.phase=3;msg('They made it! Tap Dash ⚡');objective('Both dogs escaped! Run toward the forest')}}
function dash(){if(state.phase===3){state.phase=4;msg('Chapter One complete! 🌲🐾');objective('Ricky and Lucy are free!')}else msg('Escape the fence first!')}
for(const [id,fn] of [['switch',switchDog],['sniff',sniff],['dig',dig],['dash',dash],['restart',reset]])document.getElementById(id).addEventListener('click',fn);
for(const [id,dir] of [['left',-1],['right',1]]){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);state.held=dir});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(state.held===dir)state.held=0})}
addEventListener('keydown',e=>{if(e.key==='ArrowRight')state.held=1;if(e.key==='ArrowLeft')state.held=-1;if(e.key===' ')dig()});addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))state.held=0});
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function background(){let sky=ctx.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#7ec3db');sky.addColorStop(1,'#f4d5a1');rect(0,0,W,H,sky);ellipse(W*.76,H*.2,40,40,'#fff0b2');for(let i=0;i<6;i++){let x=i*160-65;ellipse(x,ground-85,150,65,i%2?'#8bbf94':'#78ac86')}rect(0,ground,W,H-ground,'#6a9f55');rect(0,ground+25,W,H-ground,'#75ab5d');for(let i=0;i<28;i++){let x=(i*79+23)%W,y=ground+25+(i*43)%(Math.max(35,H-ground-125));ellipse(x,y,2,4,i%3?'#f9e3a1':'#f5b7b6')}for(let i=0;i<5;i++){let x=(i*181+45)%W;rect(x,ground-82,9,83,'#70543a');ellipse(x+4,ground-92,34,42,'#47815a');ellipse(x-10,ground-110,26,31,'#5b9765')}}
function drawFence(){const x=fence();rect(x+8,ground-168,14,178,'#75503a');for(let i=0;i<5;i++){let px=x+i*29;rect(px,ground-172,26,170,'#c29160');ctx.fillStyle='#c29160';ctx.beginPath();ctx.moveTo(px,ground-172);ctx.lineTo(px+13,ground-191);ctx.lineTo(px+26,ground-172);ctx.fill();rect(px+21,ground-170,2,160,'#9d704c')}rect(x,ground-136,175,13,'#8d633f');rect(x,ground-44,175,12,'#8d633f');if(state.progress){ellipse(x+7,ground+9,Math.min(52,12+state.progress*3.1),Math.min(19,4+state.progress),'#60492d');ellipse(x+5,ground+12,Math.min(43,8+state.progress*2.7),Math.min(13,2+state.progress*.8),'#32291e')}}
function dog(x,kind){let big=kind==='Ricky',s=big?1.05:.81;let y=ground-17;ctx.save();ctx.translate(x,y);ctx.scale(s,s);let walking=state.phase===0&&state.held!==0;let step=walking?Math.sin(state.walk)*8:0;let coat=big?'#69402a':'#784a30',shade=big?'#50301f':'#5a3825';ellipse(0,10,57,9,'#4b693f66');ctx.strokeStyle=coat;ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-37,-43);ctx.quadraticCurveTo(-60,-65,-54,-84+Math.sin(state.time*6)*8);ctx.stroke();for(let [xx,offset] of [[-26,step],[24,-step]]){ctx.strokeStyle=shade;ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(xx,-36);ctx.lineTo(xx+offset*.45,-8);ctx.stroke();ellipse(xx+offset*.45+4,-6,10,6,shade)}ellipse(-5,-50,48,30,coat);ellipse(31,-62,22,24,coat);ellipse(42,-83,22,21,coat);ellipse(30,-85,8,17,shade);ellipse(57,-73,11,8,'#4b2b20');ellipse(51,-91,3,3,'#171513');ctx.strokeStyle=big?'#70b8ef':'#ef93b1';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(24,-65);ctx.lineTo(43,-61);ctx.stroke();ctx.restore()}
function draw(){background();drawFence();let lead=state.leader.toLowerCase();if(state.phase===4){state.lucy+=.45;state.ricky+=.45}dog(state.ricky,'Ricky');dog(state.lucy,'Lucy');for(let p of state.particles){ellipse(p.x,p.y,3,3,'#b78a56')}}
let last=performance.now();function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;state.time+=dt;if(state.held)move(state.held,dt);state.particles=state.particles.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;return p.life>0});draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
